name: Release Browser Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Extension
        run: |
          mkdir -p dist

          cp manifest.json dist/
          cp background.js dist/
          cp content.js dist/
          cp error.html dist/
          cp bridge.js dist/
          cp error.js dist/
          cp 使用说明.md dist/


          cp -r icons dist/
          cp -r tests dist/

      - name: Package Extension
        run: |
          cd dist
          zip -r ../opal-to-sheets-${{ github.ref_name }}.zip .

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: '*.zip'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
